name: construction_estimation
description: Construction project cost estimation - standalone Android app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # State management
  provider: ^6.1.2

  # UI helpers
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # PDF generation (BOQ report အတွက်)
  pdf: ^3.11.1
  printing: ^5.13.4

  # Backup / export
  csv: ^6.0.0
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  permission_handler: ^11.3.1

  # Utility
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
